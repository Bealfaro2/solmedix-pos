<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sofía Messenger — Solmedix</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sofía">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<style>
:root{
  --blue:#185FA5; --blue-bright:#2b7fd4; --green:#10b981; --red:#ef4444;
  --bg:#0f172a; --bg-2:#1e293b; --bg-3:#263348;
  --border:rgba(148,163,184,.15); --border-soft:rgba(148,163,184,.08);
  --text:#f1f5f9; --text-2:#94a3b8; --text-3:#64748b;
  --radius-sm:8px; --radius:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
}
input,select,textarea,button{font-family:inherit;font-size:16px}
input,select,textarea{
  width:100%; background:var(--bg-3); border:1px solid var(--border); color:var(--text);
  border-radius:var(--radius-sm); padding:11px 12px; outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--blue-bright)}
button{cursor:pointer; border:none; border-radius:var(--radius-sm)}
.btn{background:var(--bg-3); color:var(--text); border:1px solid var(--border); padding:11px 16px; font-weight:600}
.btn-p{background:var(--blue); color:#fff}
.btn-p:active{background:var(--blue-bright)}
.hidden{display:none !important}

/* ── LOGIN ── */
#login{height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px}
#login img{width:88px; height:88px; margin-bottom:18px; border-radius:22px}
#login h1{font-size:20px; margin:0 0 4px}
#login p{color:var(--text-3); font-size:13px; margin:0 0 28px}
#login-form{width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px}
#login-err{color:var(--red); font-size:13px; text-align:center; display:none}

/* ── APP SHELL ── */
#app{height:100vh; display:flex; flex-direction:column}
.topbar{
  flex-shrink:0; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top));
  background:var(--bg-2); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px;
}
.topbar h2{font-size:16px; margin:0; flex:1}
.topbar .sub{font-size:11px; color:var(--text-3); font-weight:400}
.icon-btn{background:transparent; border:none; color:var(--text); font-size:20px; padding:4px 8px}

/* ── LISTA ── */
#vista-lista{flex:1; display:flex; flex-direction:column; overflow:hidden}
#buscar-wrap{padding:10px 12px; background:var(--bg-2); border-bottom:1px solid var(--border)}
#lista{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
.item{padding:13px 16px; border-bottom:1px solid var(--border-soft); display:flex; flex-direction:column; gap:3px; active-opacity:.7}
.item:active{background:var(--bg-3)}
.item-top{display:flex; justify-content:space-between; align-items:center; gap:8px}
.item-nombre{font-size:15px; font-weight:600; display:flex; align-items:center; gap:6px; min-width:0}
.item-nombre span.txt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dot{width:9px; height:9px; border-radius:50%; background:var(--green); flex-shrink:0}
.item-hora{font-size:11px; color:var(--text-3); flex-shrink:0}
.item-prev{font-size:13px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.badge-esc{background:rgba(239,68,68,.18); color:#fca5a5; font-size:9px; padding:2px 7px; border-radius:8px; flex-shrink:0}
.estado{padding:40px 16px; text-align:center; color:var(--text-3); font-size:14px}
#fab-nuevo{
  position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom));
  width:56px; height:56px; border-radius:50%; background:var(--blue); color:#fff;
  font-size:26px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.4); z-index:10;
}
#btn-marcar-leidos{margin:8px 12px; width:calc(100% - 24px); font-size:12px; padding:8px}

/* ── CHAT ── */
#vista-chat{flex:1; display:none; flex-direction:column; overflow:hidden}
#vista-chat.on{display:flex}
#vista-lista.off{display:none}
.chat-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px; display:flex; flex-direction:column; gap:8px}
.bub{max-width:78%; padding:9px 12px; border-radius:var(--radius); font-size:14.5px; line-height:1.4; white-space:pre-wrap}
.bub-cli{align-self:flex-start; background:var(--bg-3); border-bottom-left-radius:3px}
.bub-sof{align-self:flex-end; background:var(--blue); color:#fff; border-bottom-right-radius:3px}
.bub-hora{font-size:9.5px; color:rgba(255,255,255,.55); margin-top:3px}
.bub-cli .bub-hora{color:var(--text-3)}

/* ── COMPOSE ── */
.compose{flex-shrink:0; background:var(--bg-2); border-top:1px solid var(--border); padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.compose select{margin-bottom:8px}
.campos{display:none}
.campos.on{display:block}
#estado-envio{font-size:12px; color:var(--text-3); margin-top:6px; text-align:center; min-height:16px}

/* ── MODAL NUEVO CHAT ── */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; z-index:50}
.overlay.on{display:flex}
.sheet{width:100%; background:var(--bg-2); border-radius:20px 20px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 14px}
.sheet .fr{margin-bottom:10px}
.sheet label{font-size:12px; color:var(--text-3); display:block; margin-bottom:4px}
.hint{font-size:11px; color:var(--text-3); margin:-4px 0 12px}
.sheet-actions{display:flex; gap:8px; margin-top:6px}
.sheet-actions button{flex:1; padding:13px}


/* ════════════════════════════════════════════════════
   SOFÍA APP — interfaz alineada con Admin
   Adaptación iPhone/PWA: superficies, iconografía y compositor
════════════════════════════════════════════════════ */
:root{
  --surface-0:#0b1220;
  --surface-1:#111c2d;
  --surface-2:#172337;
  --surface-3:#1d2b41;
  --line:rgba(148,163,184,.13);
  --line-strong:rgba(148,163,184,.22);
  --blue-glow:rgba(24,95,165,.18);
  --app-height:100dvh;
}
body{background:var(--surface-0);padding:0;overflow:hidden}
#login{height:var(--app-height);padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
#login-form{gap:10px}
#login-form input,#login-form select{background:var(--surface-2);border-color:var(--line-strong)}
#app{height:var(--app-height);min-height:0;background:var(--surface-0);overflow:hidden}

.ui-icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;flex:0 0 18px}
.icon-btn{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:10px;color:var(--text-2);background:transparent;border:1px solid transparent}
.icon-btn:active{background:var(--surface-2);color:var(--text)}
.icon-btn:focus-visible,.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--blue-glow);border-color:var(--blue-bright)}

.topbar{padding:11px 12px;padding-top:calc(11px + env(safe-area-inset-top));background:var(--surface-1);border-color:var(--line);gap:7px;min-height:62px}
.topbar h2{font-size:16px;letter-spacing:-.015em}
.topbar .sub{font-size:10.5px;color:var(--text-3);margin-top:2px}
.topbar-title{min-width:0;flex:1}
.topbar-title h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-status{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-3);margin-top:3px}
.live-dot{width:7px;height:7px;border-radius:50%;background:#9ca3af;display:inline-block;flex:0 0 7px}

#vista-lista,#vista-chat{min-height:0;background:var(--surface-0)}
#buscar-wrap{padding:10px 12px;background:var(--surface-1);border-color:var(--line)}
#buscar{background:var(--surface-2);border-color:var(--line-strong);min-height:42px}
#buscar:focus{border-color:var(--blue-bright);box-shadow:0 0 0 3px var(--blue-glow)}
#lista{min-height:0;background:var(--surface-0)}
.item{padding:12px 14px;border-color:var(--line);gap:4px}
.item:active{background:var(--surface-2)}
.item-nombre{font-size:14.5px}
.item-prev{font-size:12.5px}
.item-match{font-size:10.5px;color:var(--blue-bright);margin-top:2px}
.badge-esc{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.2);font-size:9px}
#btn-marcar-leidos{margin:8px 12px;width:calc(100% - 24px);min-height:38px;padding:8px 12px;font-size:11px;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--surface-1);border-color:var(--line)}
#fab-nuevo{width:54px;height:54px;background:var(--blue);box-shadow:0 8px 24px rgba(0,0,0,.38)}
#fab-nuevo .ui-icon{width:22px;height:22px}
#vista-lista.off + #fab-nuevo{display:none}

.chat-topbar{border-bottom:1px solid var(--line)}
.chat-topbar .chat-identity{min-width:0;flex:1}
#chat-numero{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#presencia-otros{font-size:10px!important;color:#f59e0b!important;margin-top:3px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.quick-actions{flex:0 0 auto;display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 10px;background:var(--surface-1);border-bottom:1px solid var(--line)}
.quick-actions::-webkit-scrollbar{display:none}
.quick-action{flex:0 0 auto;min-height:38px;padding:7px 10px;display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line);font-size:10.5px;font-weight:600;white-space:nowrap}
.quick-action .ui-icon{width:15px;height:15px;flex-basis:15px}
.quick-action:active{background:var(--surface-3);color:var(--text)}

.chat-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px;gap:9px;background:var(--surface-0)}
.bub{max-width:86%;padding:9px 11px;border-radius:10px;font-size:14px;line-height:1.42}
.bub-cli{background:var(--surface-2);color:var(--text);border-bottom-left-radius:3px}
.bub-sof{background:#185FA5;color:#fff;border-bottom-right-radius:3px}
.date-chip{display:inline-block;background:var(--surface-2);color:var(--text-3);font-size:10.5px;padding:4px 11px;border-radius:9px}

.compose{flex:0 0 auto;min-height:0;background:var(--surface-1);border-color:var(--line);padding:9px 10px;padding-bottom:calc(9px + env(safe-area-inset-bottom));box-shadow:0 -10px 24px rgba(0,0,0,.12)}
.compose select{margin:0 0 7px;background:var(--surface-2);border-color:var(--line-strong);min-height:40px;font-size:16px}
.compose .campos{margin:0}
.compose input{background:var(--surface-2);border-color:var(--line-strong);margin:0;font-size:16px}
#c-mensaje{display:block;width:100%;min-height:78px;max-height:150px;resize:none;background:var(--surface-2)!important;color:var(--text)!important;border:1px solid var(--line-strong)!important;border-radius:9px!important;padding:10px 11px!important;font-size:16px!important;line-height:1.42!important;caret-color:#fff!important;-webkit-text-fill-color:var(--text)!important}
#c-mensaje::placeholder{color:var(--text-3)!important;opacity:1}
#c-mensaje:focus{outline:none!important;border-color:var(--blue-bright)!important;box-shadow:0 0 0 3px var(--blue-glow)!important}
#c-mensaje::selection{background:rgba(43,127,212,.45);color:#fff}
.compose-foot{display:flex;align-items:center;gap:8px;margin-top:8px}
#estado-envio{flex:1;min-height:16px;margin:0;text-align:left;font-size:10.5px;line-height:1.35}
#btn-enviar{flex:0 0 auto;min-height:42px;padding:9px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:12px}
#btn-enviar .ui-icon{width:16px;height:16px;flex-basis:16px}

.btn{background:var(--surface-2);border-color:var(--line);color:var(--text);border-radius:9px}
.btn-p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.estado{color:var(--text-3)}
.sheet{background:var(--surface-1);border-top:1px solid var(--line)}
.sheet input,.sheet select,.sheet textarea{background:var(--surface-2);border-color:var(--line-strong)}
.overlay{background:rgba(0,0,0,.7)}

.login-eye .eye-off{display:none}
.login-eye.showing .eye-open{display:none}
.login-eye.showing .eye-off{display:block}

@media(max-width:390px){
  .quick-action{padding:7px 9px;font-size:10px}
  .bub{max-width:90%}
  #btn-enviar span{display:none}
  #btn-enviar{width:44px;padding:9px}
}

</style>
</head>
<body>

<!-- ═══════ LOGIN ═══════ -->
<div id="login">
  <img src="icon-192.png" alt="Sofía">
  <h1>Sofía Messenger</h1>
  <p>Solmedix Soluciones Médicas</p>
  <div id="login-form">
    <select id="login-perfil">
      <option value="">Selecciona tu perfil</option>
      <option value="admin">Administrador</option>
      <option value="mty">Sucursal Monterrey</option>
    </select>
    <div style="position:relative">
      <input type="password" id="login-pwd" placeholder="Contraseña" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding-right:40px">
      <button type="button" id="btn-login-ojo" class="icon-btn login-eye" onclick="toggleOjoLogin(this)" aria-label="Mostrar contraseña" style="position:absolute;right:4px;top:50%;transform:translateY(-50%)">
        <svg class="ui-icon eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
        <svg class="ui-icon eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6 0 9.5 6 9.5 6a16.5 16.5 0 0 1-2.1 2.8M6.2 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6c1.3 0 2.5-.3 3.5-.7"/></svg>
      </button>
    </div>
    <button class="btn btn-p" onclick="login()">Entrar</button>
    <div id="login-err"></div>
  </div>
</div>

<!-- ═══════ APP ═══════ -->
<div id="app" class="hidden">

  <!-- Vista lista -->
  <div id="vista-lista">
    <div class="topbar">
      <div class="topbar-title">
        <h2>Sofía</h2>
        <div class="sub" id="perfil-chip"></div>
        <div id="sse-estado" class="live-status">
          <span id="sse-dot" class="live-dot"></span>
          <span id="sse-texto">Conectando</span>
        </div>
      </div>
      <button class="icon-btn" onclick="activarNotificaciones()" title="Activar notificaciones" aria-label="Activar notificaciones"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></button>
      <button class="icon-btn" onclick="cargarConversaciones()" title="Actualizar conversaciones" aria-label="Actualizar conversaciones"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M19 11a7 7 0 1 0 1 4"/></svg></button>
    </div>
    <div id="buscar-wrap">
      <input type="text" id="buscar" placeholder="Buscar cliente, número o medicamento..." oninput="renderLista()">
    </div>
    <button class="btn" id="btn-marcar-leidos" onclick="marcarTodosLeidos()"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span>Marcar todo como leído</span></button>
    <div id="lista"><div class="estado">Cargando...</div></div>
  </div>
  <button id="fab-nuevo" onclick="abrirModalNuevo()" aria-label="Nuevo chat"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

  <!-- Vista chat -->
  <div id="vista-chat">
    <div class="topbar chat-topbar">
      <button class="icon-btn" onclick="volverALista()" aria-label="Volver a conversaciones"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="chat-identity">
        <h2 id="chat-nombre">—</h2>
        <div class="sub" id="chat-numero"></div>
        <div id="presencia-otros" style="display:none"></div>
      </div>
    </div>
    <div class="quick-actions" aria-label="Acciones rápidas">
      <button class="quick-action" onclick="abrirModalGuia()"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 8-4 8 4-8 4-8-4Z"/><path d="M4 7v10l8 4 8-4V7M12 11v10"/></svg><span>Guía</span></button>
      <button class="quick-action" onclick="enviarDatosPago()"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>Pago</span></button>
      <button class="quick-action" onclick="enviarUbicacion()"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Ubicación</span></button>
      <button class="quick-action" onclick="document.getElementById('input-archivo').click()"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.6-9.6a4 4 0 0 1 5.7 5.7l-9.6 9.6a2 2 0 1 1-2.8-2.8l8.9-8.9"/></svg><span>Adjuntar</span></button>
      <button class="quick-action" onclick="reactivarChat()"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6"/><path d="M5.5 15a8 8 0 1 0 1.2-8.7L4 10"/></svg><span>Reiniciar</span></button>
      <input type="file" id="input-archivo" accept="image/*,application/pdf" style="display:none" onchange="adjuntarArchivo(this)">
    </div>
    <div class="chat-body" id="chat-body"></div>
    <div class="compose">
      <select id="tipo" onchange="cambiarTipo()">
        <option value="instruccion">Responder al cliente</option>
        <option value="pago_confirmado">Pago confirmado</option>
        <option value="disponibilidad_confirmada">Disponibilidad confirmada</option>
        <option value="producto_listo">Producto listo para recoger</option>
      </select>
      <div class="campos on" id="campos-instruccion">
        <textarea id="c-mensaje" rows="3" placeholder="Escribe tu mensaje para el cliente..."></textarea>
      </div>
      <div class="campos" id="campos-pago">
        <input type="text" id="c-entrega" placeholder="Detalle de entrega (opcional)">
      </div>
            <div class="campos" id="campos-disp">
        <input type="text" id="c-detalle-disp" placeholder="Detalle (opcional, ej: 2 piezas, entrega en 2 días)">
      </div>
      <div class="campos" id="campos-listo">
        <input type="text" id="c-detalle-listo" placeholder="Detalle (opcional, ej: Trae el resto: $850)">
      </div>
      <div class="compose-foot">
        <div id="estado-envio"></div>
        <button class="btn btn-p" id="btn-enviar" onclick="enviarComando()"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7Z"/></svg><span>Enviar al cliente</span></button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════ MODAL: GENERAR GUÍA ═══════ -->
<div class="overlay" id="modal-guia" onclick="if(event.target===this)cerrarModalGuia()" style="background:rgba(0,0,0,.2)">
  <div class="sheet" style="max-height:65vh;overflow-y:auto">
    <h3>Generar guía de envío</h3>
    <div class="fr"><label>Medicamento</label><input type="text" id="g-medicamento" placeholder="Nombre exacto del catálogo"></div>
    <div class="fr"><label>Calle y número</label><input type="text" id="g-calle" placeholder="Insurgentes Sur 1234"></div>
    <div class="fr"><label>Código Postal</label><input type="text" id="g-cp" placeholder="06600"></div>
    <div class="fr"><label>Estado</label><input type="text" id="g-estado" placeholder="Ciudad de Mexico"></div>
    <div class="fr"><label>Municipio</label><input type="text" id="g-municipio" placeholder="Cuauhtemoc"></div>
    <div class="fr"><label>Colonia</label><input type="text" id="g-colonia" placeholder="Juarez"></div>
    <div class="hint">Estafeta (más rápida) con DHL de respaldo. Puede tardar unos segundos.</div>

// ── JSONP genérico ──
function jsonp(url, callback) {
  var cbName = 'cb_' + Math.random().toString(36).slice(2);
  var timeout = setTimeout(function() {
    if (window[cbName]) { delete window[cbName]; var sc=document.getElementById('sc_'+cbName); if(sc) sc.remove(); callback(new Error('Timeout')); }
  }, 10000);
  window[cbName] = function(res) {
    clearTimeout(timeout); delete window[cbName];
    var sc = document.getElementById('sc_'+cbName); if(sc) sc.remove();
    callback(null, res);
  };
  var script = document.createElement('script');
  script.id = 'sc_'+cbName;
  script.onerror = function(){ clearTimeout(timeout); delete window[cbName]; script.remove(); callback(new Error('Error de red')); };
  script.src = url + (url.indexOf('?')>-1?'&':'?') + 'callback=' + cbName + '&t=' + Date.now();
  document.head.appendChild(script);
}
function apiGet(accion, callback) { jsonp(API_URL+'?accion='+accion, function(err,res){ callback(err,res); }); }
function apiPost(data, callback) {
  var encoded = encodeURIComponent(JSON.stringify(data));
  jsonp(API_URL+'?_data='+encoded, function(err,res){ callback(err,res); });
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

      '<div class="item-prev">'+prev+'</div>'+matchTag+'</div>';
  }).join('');

function fechaEtiqueta(fechaStr) {
  var partes = (fechaStr || '').split('/');
  if (partes.length !== 3) return fechaStr || '';
  var d = parseInt(partes[0],10), m = parseInt(partes[1],10)-1, y = parseInt(partes[2],10);
  var fecha = new Date(y, m, d);
  var hoy = new Date(); hoy.setHours(0,0,0,0);
  var ayer = new Date(hoy); ayer.setDate(ayer.getDate()-1);
  fecha.setHours(0,0,0,0);
  if (fecha.getTime() === hoy.getTime()) return 'Hoy';
  if (fecha.getTime() === ayer.getTime()) return 'Ayer';
  var diffDias = Math.round((hoy - fecha) / 86400000);
  var diasSemana = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  if (diffDias > 1 && diffDias < 7) return diasSemana[fecha.getDay()];
  return fechaStr;
}

var chatHiloLength = 0;
var chatUltimaFecha = null;

function abrirChat(numero, nombre) {
  var esRefrescoMismoChat = clienteActual && clienteActual.numero === numero && document.getElementById('vista-chat').classList.contains('on');
  var entradaDireccion = ultimaLista.filter(function(c){ return c.numero === numero; })[0];
  clienteActual = { numero:numero, nombre:nombre, direccion: entradaDireccion ? entradaDireccion.direccion : '', direccionEstructurada: entradaDireccion ? entradaDireccion.direccion_estructurada : null };
  if (!esRefrescoMismoChat) {
    var entrada = ultimaLista.filter(function(c){ return c.numero===numero; })[0];
    if (entrada) marcarVisto(entrada);
    document.getElementById('chat-nombre').textContent = nombre || numero;
    document.getElementById('chat-numero').textContent = numero;
    document.getElementById('vista-lista').classList.add('off');
    document.getElementById('vista-chat').classList.add('on');
    avisarViendoChat(numero);
  }
  var body = document.getElementById('chat-body');
  if (!esRefrescoMismoChat) {
    body.innerHTML = '<div class="estado">Cargando mensajes...</div>';
    chatHiloLength = 0;
    chatUltimaFecha = null;
  }
  jsonp(API_URL+'?accion=hilo_sofia&numero='+encodeURIComponent(numero), function(err, res) {
    if (err || !res || !res.ok) {
      if (!esRefrescoMismoChat) body.innerHTML = '<div class="estado">Error al cargar</div>';
      return;
    }
    if (esRefrescoMismoChat && res.hilo.length <= chatHiloLength) return;

    var cercaDelFinal = body.scrollHeight - body.scrollTop - body.clientHeight < 120;
    var mensajesAPintar = esRefrescoMismoChat ? res.hilo.slice(chatHiloLength) : res.hilo;

    var htmlNuevo = mensajesAPintar.map(function(m){
      var b = '';
      if (m.fecha !== chatUltimaFecha) {
        chatUltimaFecha = m.fecha;
        b += '<div style="text-align:center;margin:10px 0"><span class="date-chip">'+fechaEtiqueta(m.fecha)+'</span></div>';
      }
      if (m.mensaje_cliente) b += '<div class="bub bub-cli">'+esc(m.mensaje_cliente)+'<div class="bub-hora">'+m.hora+'</div></div>';
      if (m.respuesta_sofia) b += '<div class="bub bub-sof">'+esc(m.respuesta_sofia)+'<div class="bub-hora">'+m.hora+'</div></div>';
      return b;
    }).join('');

    if (esRefrescoMismoChat) {
      body.insertAdjacentHTML('beforeend', htmlNuevo);
    } else {
      body.innerHTML = htmlNuevo;
    }
    chatHiloLength = res.hilo.length;

    if (!esRefrescoMismoChat || cercaDelFinal) {
      body.scrollTop = body.scrollHeight;
    }
  });
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function activarNotificaciones() {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      alert('Este dispositivo no soporta notificaciones push, o no la abriste desde el ícono instalado en tu pantalla de inicio.');
      return;
    }
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted') {
      alert('No se activaron. Puedes darle permiso después desde Ajustes de iPhone → Notificaciones → Sofía.');
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    apiPost({ accion: 'suscribir_push_sofia', perfil: perfilActual, subscription: sub.toJSON() }, function(err, res) {
      if (err || !res || !res.ok) { alert('No se pudo activar: ' + ((res && res.error) || err)); return; }
      alert('Notificaciones activadas');
    });
  } catch (e) {
    alert('Error: ' + e.message);
  }
}
